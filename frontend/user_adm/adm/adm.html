<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics - Circuito Terê Verde</title>

  <link rel="stylesheet" href="adm.css" />
  <link rel="icon" type="image/png" href="../../favicon.png">
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>Circuito Terê Verde</h2>

    <nav>
      <ul>
        <li><a href="../adm.html" class="active">📊 Analytics</a></li>
        <li><a href="../Relatorios/relatorios.html">📈 Relatórios</a></li>
        <li><a href="../Conteúdos/conteudos.html">📜 Conteúdos</a></li>
      </ul>
    </nav>
  </aside>

  <!-- CONTEÚDO -->
  <div class="main-content">

    <header class="admin-header">
      <div class="admin-user" id="adminUser">
        <span>Administrador</span>

        <div class="dropdown" id="dropdownMenu">
          <a href="#">Configurações</a>
          <a href="#">Sair</a>
        </div>
      </div>
    </header>

    <section class="dashboard">

      <h1>Analytics de Cliques</h1>

      <!-- RESUMO -->
      <div class="summary-cards">

        <div class="card">
          <h3>Total de Cliques</h3>
          <p id="totalClicks">0</p>
        </div>

      </div>

      <!-- LISTA DE EVENTOS -->
      <div class="chart-box">

        <h3>Eventos mais clicados</h3>

        <div id="clickList"></div>

      </div>

      <button id="clearAnalytics">
        Limpar dados
      </button>

    </section>

  </div>

  <script src="adm.js"></script>

</body>
</html>
